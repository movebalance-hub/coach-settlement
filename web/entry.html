<!doctype html>
<html lang="zh-Hant" class="app-locked">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教練銷課快速登記</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="topnav">
    <a href="index.html">首頁</a>
    <a href="entry.html" class="active">快速登記</a>
    <a href="report.html">月結報表</a>
  </nav>

  <div class="card">
    <h1>教練銷課快速登記</h1>
    <form id="entry-form">
      <div class="field">
        <label for="coach-select">教練</label>
        <select id="coach-select" required>
          <option value="">請選擇教練</option>
        </select>
      </div>

      <div class="field" id="new-coach-field" style="display: none">
        <label for="new-coach-name">新教練姓名</label>
        <input type="text" id="new-coach-name" placeholder="輸入新教練姓名" />
      </div>

      <div class="field">
        <label for="member-name">會員姓名</label>
        <input type="text" id="member-name" required placeholder="直接輸入姓名即可" />
      </div>

      <div class="field">
        <label for="unit-price">方案單價</label>
        <input type="number" id="unit-price" step="0.01" min="0" required />
      </div>

      <div class="field">
        <label for="sessions-used">本次銷課堂數</label>
        <input type="number" id="sessions-used" step="0.5" min="0.5" required />
      </div>

      <div class="field">
        <label for="remaining-sessions">剩餘堂數（純紀錄，不自動計算）</label>
        <input type="number" id="remaining-sessions" step="0.5" min="0" required />
      </div>

      <div class="field">
        <label for="sales-date">銷課日期</label>
        <input type="date" id="sales-date" required />
      </div>

      <button type="submit" id="submit-btn">送出登記</button>
      <div class="message" id="message"></div>
    </form>
  </div>

  <div class="card">
    <h2>近期登記紀錄</h2>
    <table class="list-table">
      <thead>
        <tr>
          <th>日期</th>
          <th>教練</th>
          <th>會員</th>
          <th>單價</th>
          <th>堂數</th>
          <th>剩餘</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="record-list">
        <tr class="empty-row"><td colspan="7">載入中...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="common.js"></script>
  <script src="entry.js"></script>
</body>
</html>
