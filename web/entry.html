<!doctype html>
<html lang="zh-Hant" class="app-locked">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教練銷課快速登記</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="topnav">
    <a href="index.html">首頁</a>
    <a href="entry.html" class="active">快速登記</a>
    <a href="members.html">會員管理</a>
    <a href="report.html">月結報表</a>
  </nav>

  <div class="card">
    <h1>教練銷課快速登記</h1>
    <form id="entry-form">
      <div class="field">
        <label for="coach-select">教練</label>
        <select id="coach-select" required disabled>
          <option value="">載入中...</option>
        </select>
      </div>

      <div class="field" id="new-coach-field" style="display: none">
        <label for="new-coach-name">新教練姓名</label>
        <input type="text" id="new-coach-name" placeholder="輸入新教練姓名" />
      </div>

      <div class="checkbox-field">
        <label>
          <input type="checkbox" id="one-time-member" />
          單次消費會員（不建檔，直接輸入姓名即可）
        </label>
      </div>

      <div class="field">
        <label for="member-name">會員姓名</label>
        <div class="combobox">
          <input type="text" id="member-name" required placeholder="輸入姓名以搜尋既有會員" autocomplete="off" />
          <ul class="combobox-list" id="member-name-list"></ul>
        </div>
      </div>

      <div class="field" id="member-current-remaining-field">
        <label for="member-current-remaining">會員目前剩餘堂數</label>
        <input type="text" id="member-current-remaining" placeholder="選擇會員後自動顯示" disabled />
      </div>

      <div class="field">
        <label for="unit-price">方案單價</label>
        <input type="number" id="unit-price" step="0.01" min="0" required placeholder="選擇會員後自動帶入，可手動覆蓋" />
      </div>

      <div class="field">
        <label for="sessions-used">本次銷課堂數</label>
        <input type="number" id="sessions-used" step="0.5" min="0.5" required />
      </div>

      <div class="field">
        <label for="sales-date">銷課日期</label>
        <input type="date" id="sales-date" required />
      </div>

      <button type="submit" id="submit-btn">送出登記</button>
      <div class="message" id="message"></div>
    </form>
  </div>

  <div class="card">
    <h2>登記紀錄</h2>
    <div class="field">
      <label for="record-month-select">選擇月份</label>
      <input type="month" id="record-month-select" />
    </div>
    <table class="list-table">
      <thead>
        <tr>
          <th>日期</th>
          <th>教練</th>
          <th>會員</th>
          <th>單價</th>
          <th>堂數</th>
          <th>剩餘</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="record-list">
        <tr class="empty-row"><td colspan="7">載入中...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card" id="edit-card" style="display: none">
    <h2>編輯登記紀錄</h2>
    <form id="edit-form">
      <div class="field">
        <label for="edit-coach">教練</label>
        <select id="edit-coach" required></select>
      </div>

      <div class="checkbox-field">
        <label>
          <input type="checkbox" id="edit-one-time-member" />
          單次消費會員（不建檔，直接輸入姓名即可）
        </label>
      </div>

      <div class="field">
        <label for="edit-member">會員姓名</label>
        <div class="combobox">
          <input type="text" id="edit-member" required autocomplete="off" />
          <ul class="combobox-list" id="edit-member-list"></ul>
        </div>
      </div>

      <div class="field" id="edit-member-current-remaining-field">
        <label for="edit-member-current-remaining">會員目前剩餘堂數</label>
        <input type="text" id="edit-member-current-remaining" disabled />
      </div>

      <div class="field">
        <label for="edit-price">方案單價</label>
        <input type="number" id="edit-price" step="0.01" min="0" required />
      </div>

      <div class="field">
        <label for="edit-sessions">本次銷課堂數</label>
        <input type="number" id="edit-sessions" step="0.5" min="0.5" required />
      </div>

      <div class="field">
        <label for="edit-date">銷課日期</label>
        <input type="date" id="edit-date" required />
      </div>

      <div class="button-row">
        <button type="submit" id="edit-save-btn">儲存</button>
        <button type="button" id="edit-cancel-btn" class="secondary-btn">取消</button>
      </div>
      <div class="message" id="edit-message"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="common.js"></script>
  <script src="combobox.js"></script>
  <script src="entry.js"></script>
</body>
</html>
